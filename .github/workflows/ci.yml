name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values for unit tests that mock DB connections
      ARANGO_ENDPOINT: "http://127.0.0.1:8529"
      ARANGO_DATABASE: "test_db"
      ARANGO_USERNAME: "root"
      ARANGO_PASSWORD: "test_password"
      ARANGO_DB_NAME: "test_db"
      # Real server for the database-backed storage suites. Deliberately NOT
      # port 8529, so the dummy endpoint above stays unreachable as before.
      ARANGO_TEST_URL: "http://127.0.0.1:18529"
      ARANGO_TEST_USERNAME: "root"
      ARANGO_TEST_PASSWORD: "test"
      ARANGO_TEST_DB: "aga_test"

    services:
      arangodb:
        image: arangodb:3.12.11
        env:
          ARANGO_ROOT_PASSWORD: "test"
        ports:
          - 18529:8529

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements-dev.txt
    
    - name: Wait for ArangoDB
      run: |
        for _ in $(seq 1 60); do
          curl -fsS -u root:test "$ARANGO_TEST_URL/_api/version" >/dev/null && break
          sleep 2
        done
        curl -fsS -u root:test "$ARANGO_TEST_URL/_api/version"
        curl -fsS -u root:test -X POST "$ARANGO_TEST_URL/_api/database" \
          -H 'Content-Type: application/json' \
          -d "{\"name\": \"$ARANGO_TEST_DB\"}"

    - name: Run database-backed storage tests
      # These suites skip themselves when ARANGO_TEST_URL is unset, which is
      # how they sat unexecuted while the index-creation regression (#25) went
      # unnoticed. The guard below fails the build if they ever skip again.
      run: |
        pytest tests/catalog/test_storage.py tests/product/test_storage.py \
          -q --junitxml=db-tests.xml
        python - <<'GUARD'
        import sys, xml.etree.ElementTree as ET
        root = ET.parse("db-tests.xml").getroot()
        suite = root.find("testsuite") if root.tag == "testsuites" else root
        ran = int(suite.get("tests", 0)) - int(suite.get("skipped", 0))
        if ran < 20:
            sys.exit(f"database-backed tests did not run: only {ran} executed")
        print(f"{ran} database-backed tests executed")
        GUARD

    - name: Run tests with coverage
      run: |
        pytest --cov=graph_analytics_ai --cov-report=term-missing --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy
    
    - name: Run flake8
      run: |
        flake8 graph_analytics_ai tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 graph_analytics_ai tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check graph_analytics_ai tests
    
    - name: Run mypy type checking
      run: |
        mypy graph_analytics_ai --ignore-missing-imports || true

